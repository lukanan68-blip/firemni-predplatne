name: Denní aktualizace titulků k tématům

on:
  schedule:
    # 5:10 UTC -- pár minut po denním screenshotu titulky, ať neběží současně
    - cron: "10 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stáhnout dnešní titulky
        run: node .github/scripts/refresh-temata.js

      - name: Commitnout, jen pokud se něco změnilo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/temata-live.js
          if git diff --cached --quiet; then
            echo "Beze změny, commit se přeskakuje."
            exit 0
          fi
          git commit -m "Automatická aktualizace titulků k tématům"
          # Druhý denní robot (hero screenshot) může pushnout těsně předtím --
          # pár pokusů s rebase na čerstvý main, ať to souběh nezastaví.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push se nepovedl (pokus $i), zkouším rebase na aktuální main..."
            git pull --rebase origin main
            sleep 3
          done
          echo "Push se nepovedl ani po 5 pokusech."
          exit 1
